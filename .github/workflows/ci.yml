# 持续集成 —— 把"改了 src/ 忘了重新 build lib/"这类**静默事故**堵在门口。
#
# `lib/` 是提交进 git 的构建产物（AGENTS.md §8.2 第 9 条），以前只靠人在保证；本工作流
# 是唯一能自动发现"产物与源码不同步"的东西：构建是确定性的（同输入同字节，见 AGENTS §3），
# 所以重新 build 一遍之后 `git diff --exit-code -- lib/` 为空才说明产物是新的。
#
# 四步分别是：
#   1. `pnpm install --frozen-lockfile`：lockfile 必须与 package.json 一致；
#   2. `pnpm run check`：两个 tsconfig 的 typecheck + Prettier 格式检查 + `node --check`；
#   3. `pnpm test`：build → artifact / client / smoke / activation 四个自检；
#   4. `git diff --exit-code -- lib/`：产物闸（第 3 步已经重新构建过，所以这里看到的就是新产物）。
#
# ⚠️ runner 上没有 DSH，`activation.mjs` 会打印 **SKIP** 并以 0 退出（抽不出 cordis 就跳过）
# —— 那不是"通过"，激活路径与 405 事故的回归**只在真机上有效**（AGENTS.md §6 已写明）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本与本机实测一致（pnpm 11 / Node 24，见 AGENTS.md §1）。
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (lockfile must be in sync)
        run: pnpm install --frozen-lockfile

      - name: Static checks (typecheck + format + node --check)
        run: pnpm run check

      - name: Self-tests (builds lib/ first)
        run: pnpm test

      - name: lib/ must match src/
        run: |
          if ! git diff --exit-code -- lib/; then
            echo "::error::lib/ 是构建产物，和 src/ 不同步 —— 本地跑 'pnpm run build' 并把 lib/ 一起提交"
            exit 1
          fi
